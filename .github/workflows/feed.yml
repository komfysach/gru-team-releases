# NOT a workflow of this repository. It belongs in the public releases repository
# (komfysach/gru-team-releases) as .github/workflows/feed.yml, and is kept here so
# it is reviewed with the release pipeline. See docs/releases.md.
#
# When a release is published by hand, its latest.json becomes the channel feed:
# every release feeds `beta`, and a non-prerelease also feeds `stable`. The feeds
# are rolling releases named channel-stable and channel-beta, marked prerelease so
# GitHub's "Latest" stays the newest real stable.
name: Channel feeds

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  feed:
    # The feed releases themselves are created with GITHUB_TOKEN, which never
    # triggers a workflow; this guard is belt and braces.
    if: ${{ !startsWith(github.event.release.tag_name, 'channel-') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: Read the release's latest.json
        run: gh release download "$TAG" --repo "$REPO" --pattern latest.json --dir published

      # Assets uploaded to a draft can carry untagged-… URLs; point every
      # platform at the published tag instead.
      - name: Point it at the published tag
        run: |
          jq --arg base "https://github.com/$REPO/releases/download/$TAG/" \
            '.platforms |= map_values(.url = ($base + (.url | split("/") | last)))' \
            published/latest.json > latest.json
          cat latest.json
          # The two build jobs merge into one latest.json; a race between them
          # could drop a platform. Refuse a partial feed rather than strand anyone.
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null; then
              echo "::error::latest.json has no $platform entry; rerun the release's failed job, then re-publish."
              exit 1
            fi
          done

      - name: Update the channel feeds
        run: |
          channels="beta"
          if [ "$PRERELEASE" = "false" ]; then channels="stable beta"; fi
          for channel in $channels; do
            feed="channel-$channel"
            if ! gh release view "$feed" --repo "$REPO" > /dev/null 2>&1; then
              gh release create "$feed" --repo "$REPO" --prerelease --target main \
                --title "Update feed: $channel" \
                --notes "Gru Team's $channel update feed. Not an installer: download a numbered release instead."
            fi
            gh release upload "$feed" latest.json --repo "$REPO" --clobber
            echo "$feed now announces $TAG"
          done
